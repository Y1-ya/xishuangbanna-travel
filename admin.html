<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>攻略生成器</title>
<style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#FF6B35;--gold:#F2B705;--text:#eee;--muted:#999;--border:#333;--input:#0f3460}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:1.5rem}
#lockScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#lockScreen h1{font-size:2rem;margin-bottom:0.5rem}
#lockScreen p{color:var(--muted);margin-bottom:2rem}
#lockScreen input{width:280px;padding:0.8rem 1.2rem;border-radius:50px;border:2px solid var(--border);background:var(--input);color:#fff;font-size:1rem;text-align:center;outline:none}
#lockScreen input:focus{border-color:var(--accent)}
#lockScreen button{margin-top:1rem;padding:0.8rem 2.5rem;border-radius:50px;border:none;background:var(--accent);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
#lockScreen .error{color:#e74c3c;margin-top:0.8rem;font-size:0.85rem}
#editor{display:none}
#editor h2{font-size:1.4rem;margin:1.5rem 0 0.8rem;color:var(--gold);border-bottom:2px solid var(--accent);padding-bottom:0.4rem}
label{display:block;font-size:0.85rem;color:var(--muted);margin:0.8rem 0 0.3rem}
input,textarea{width:100%;padding:0.7rem 1rem;border-radius:10px;border:1.5px solid var(--border);background:var(--input);color:#fff;font-size:0.9rem;outline:none;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem}
.spot-card{background:var(--card);border-radius:12px;padding:1rem;margin-bottom:0.8rem;border:1px solid var(--border)}
#generateBtn{display:block;width:100%;padding:1rem;margin:2rem 0;border-radius:50px;border:none;background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer;letter-spacing:2px}
#generateBtn:hover{opacity:0.9;transform:scale(1.02);transition:0.2s}
#output{background:var(--card);border-radius:12px;padding:1rem;margin-top:1rem;display:none}
#output textarea{height:200px;font-family:monospace;font-size:0.75rem}
.food-row{display:flex;gap:0.5rem;align-items:center;margin-bottom:0.4rem}
.food-row input{flex:1}
.add-btn{padding:0.4rem 1rem;border-radius:20px;border:1px dashed var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:0.8rem;margin-top:0.5rem}
.remove-btn{padding:0.3rem 0.7rem;border-radius:15px;border:1px solid #e74c3c;background:transparent;color:#e74c3c;cursor:pointer;font-size:0.75rem}
@media(max-width:600px){.row,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="lockScreen">
  <h1>🔐 攻略生成器</h1>
  <p>输入密码解锁管理后台</p>
  <input type="password" id="pwdInput" placeholder="输入密码" autofocus>
  <button onclick="unlock()">解锁</button>
  <div class="error" id="errMsg"></div>
</div>

<div id="editor">
  <h2>🌍 基础信息</h2>
  <div class="row">
    <div><label>目的地城市</label><input id="city" placeholder="例：西双版纳"></div>
    <div><label>标题副标题</label><input id="subtitle" placeholder="例：热带雨林漫游记"></div>
  </div>
  <div class="row">
    <div><label>行程天数</label><input id="days" value="4" type="number"></div>
    <div><label>标签描述</label><input id="tagline" placeholder="例：4天3夜慢游攻略 · 傣乡风情"></div>
  </div>
  <div class="row3">
    <div><label>主色调</label><input id="colorMain" value="#2E8B57"></div>
    <div><label>强调色</label><input id="colorAccent" value="#E8722A"></div>
    <div><label>金色</label><input id="colorGold" value="#DAA520"></div>
  </div>
  <div class="row">
    <div><label>封面短句</label><input id="footerLine1" placeholder="封面描述短句"></div>
    <div><label>封面长句</label><input id="footerLine2" placeholder="封面描述长句"></div>
  </div>
  <div><label>页脚署名</label><input id="footerCredit" value="小楠带你游版专属定制攻略"></div>

  <h2>🍽️ 必吃清单（名称 | 价格 | 店铺）</h2>
  <div id="foodList"></div>
  <button class="add-btn" onclick="addFood()">+ 添加美食</button>

  <h2>📷 实拍图库（标签 | 图片URL）</h2>
  <div id="galleryList"></div>
  <button class="add-btn" onclick="addGallery()">+ 添加图片</button>

  <button id="generateBtn" onclick="generate()">🚀 生成攻略HTML</button>

  <div id="output">
    <p style="color:var(--gold);margin-bottom:0.5rem">✅ HTML已生成，复制代码保存为 index.html 部署</p>
    <textarea id="outputCode" readonly></textarea>
    <button onclick="downloadHTML()" style="margin-top:0.8rem;padding:0.6rem 1.5rem;border-radius:20px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:700">⬇️ 下载 HTML 文件</button>
  </div>
</div>

<script>
var PASSWORD = 'xiaonan520';

function unlock() {
  var pwd = document.getElementById('pwdInput').value;
  if (pwd === PASSWORD) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('editor').style.display = 'block';
    document.getElementById('errMsg').textContent = '';
    initDefaults();
  } else {
    document.getElementById('errMsg').textContent = '密码错误，请重试';
  }
}

document.getElementById('pwdInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') unlock();
});

function initDefaults() {
  document.getElementById('city').value = '西双版纳';
  document.getElementById('subtitle').value = '热带雨林漫游记';
  document.getElementById('tagline').value = '4天3夜慢游攻略 · 傣乡风情 · 雨林探秘 · 东南亚味道';
  document.getElementById('footerLine1').value = '去西双版纳，做一场热带雨林的梦';
  document.getElementById('footerLine2').value = '大象在林中漫步 · 澜沧江静静流淌 · 星光夜市万家灯火';
  var foods = [
    ['香茅草烤鱼','25-45','星光夜市 / 江边夜市'],
    ['傣味烤鸡','45-68/只','曼飞龙烤鸡 / 告庄店'],
    ['舂鸡脚','15-25','啰啰冰屋 / 夜市摊位'],
    ['柠檬撒撇','15-25','耶德纳 / 傣味餐厅'],
    ['菠萝紫米饭','25-40','傣族园 / 傣家乐餐厅'],
    ['竹筒饭','8-15','街边小摊 / 夜市'],
    ['泡鲁达','12-18','啰啰冰屋 / 婉泰告庄'],
    ['老挝冰咖啡','15-25','星光夜市 / 泰舂告庄']
  ];
  for (var i = 0; i < foods.length; i++) {
    addFood(foods[i][0], foods[i][1], foods[i][2]);
  }
}

function addFood(name, price, shop) {
  name = name || ''; price = price || ''; shop = shop || '';
  var div = document.createElement('div');
  div.className = 'food-row';
  div.innerHTML = '<input value="' + name + '" placeholder="名称" style="flex:2"><input value="' + price + '" placeholder="价格" style="flex:1"><input value="' + shop + '" placeholder="店铺" style="flex:2"><button class="remove-btn" onclick="this.parentElement.remove()">X</button>';
  document.getElementById('foodList').appendChild(div);
}

function addGallery(label, url) {
  label = label || ''; url = url || '';
  var div = document.createElement('div');
  div.className = 'food-row';
  div.innerHTML = '<input value="' + label + '" placeholder="标签" style="flex:1"><input value="' + url + '" placeholder="图片URL" style="flex:3"><button class="remove-btn" onclick="this.parentElement.remove()">X</button>';
  document.getElementById('galleryList').appendChild(div);
}

function generate() {
  var city = document.getElementById('city').value || '目的地';
  var subtitle = document.getElementById('subtitle').value || '旅行攻略';
  var tagline = document.getElementById('tagline').value || '';
  var colorMain = document.getElementById('colorMain').value || '#2E8B57';
  var colorAccent = document.getElementById('colorAccent').value || '#E8722A';
  var colorGold = document.getElementById('colorGold').value || '#DAA520';
  var footerL1 = document.getElementById('footerLine1').value || '';
  var footerL2 = document.getElementById('footerLine2').value || '';
  var footerCredit = document.getElementById('footerCredit').value || '';

  fetch('/travel/index.html')
    .then(function(r) { return r.text(); })
    .then(function(template) {
      var html = template;
      html = html.replace(/西双版纳/g, city);
      html = html.replace(/--bn-green: #[^;]+/g, '--bn-green: ' + colorMain);
      html = html.replace(/--bn-orange: #[^;]+/g, '--bn-orange: ' + colorAccent);
      html = html.replace(/--bn-gold: #[^;]+/g, '--bn-gold: ' + colorGold);
      html = html.replace(/去西双版纳，做一场热带雨林的梦/g, footerL1);
      html = html.replace(/大象在林中漫步 · 澜沧江静静流淌 · 星光夜市万家灯火/g, footerL2);
      html = html.replace(/小楠带你游版专属定制攻略/g, footerCredit);
      document.getElementById('outputCode').value = html;
      document.getElementById('output').style.display = 'block';
      document.getElementById('output').scrollIntoView({behavior:'smooth'});
    })
    .catch(function(err) {
      alert('读取模板失败: ' + err.message);
    });
}

function downloadHTML() {
  var html = document.getElementById('outputCode').value;
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'travel-guide.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
